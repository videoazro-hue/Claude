name = "financezro"
main = "src/index.ts"
compatibility_date = "2026-08-01"
compatibility_flags = ["nodejs_compat"]

# Static frontend (public/index.html etc.) served alongside the Worker.
# The Worker code always runs first so it can enforce auth on /api/* routes;
# static files under public/ are served for everything else.
[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true

[[d1_databases]]
binding = "DB"
database_name = "financezro-db"
database_id = "ac09390a-aa74-49ee-92c9-fa55a055e069"

[[kv_namespaces]]
binding = "KV"
id = "de1c4bb355b04134b404683990b14934"

[vars]
# Non-secret config. Override per-environment if needed.
DEFAULT_COUNTRY = "DE"
APP_REDIRECT_URL = "https://financezro.<your-subdomain>.workers.dev/api/callback"

# Secrets (set these with `wrangler secret put <NAME>`, never commit them):
#   GC_SECRET_ID     - GoCardless Bank Account Data secret_id (free account)
#   GC_SECRET_KEY    - GoCardless Bank Account Data secret_key
#   APP_PASSWORD     - the password that gates access to your dashboard
